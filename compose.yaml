name: help-service-desk
x-app: &app
  image: help-service-desk-app:local
  build:
    context: .
    dockerfile: docker/Dockerfile
  volumes:
    - .:/var/www/html
  environment:
    DB_HOST: postgres
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    REDIS_HOST: redis
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8000"
  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --timeout=90
    restart: unless-stopped
  scheduler:
    <<: *app
    command: php artisan schedule:work
    restart: unless-stopped
  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/testing.sql:/docker-entrypoint-initdb.d/testing.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
volumes:
  postgres-data:
